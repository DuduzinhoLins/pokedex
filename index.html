<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Pokedexx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Minha Pokedex</h1>
        <p>Pesquise o seu pokemon mais daora!</p>

        <form id="formulario">
            <input 
                type="text" 
                id="pokemon" 
                placeholder="Digite o nome do Pokemon Daora!!!"
            >

            <button type="submit">Buscar</button>
        </form>

        <div id="mensagem"></div>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
